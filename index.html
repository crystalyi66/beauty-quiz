<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美容檢定・骨骼肌肉隨機測驗</title>
<style>
  :root{
    --sage:#7f9c8f;
    --sage-dark:#5f7c70;
    --cream:#faf6ec;
    --ink:#3a3a35;
    --gold:#e8c257;
    --coral:#ef7f77;
    --correct:#5f9c7a;
    --wrong:#d96b63;
    --line:#d8d2c0;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:20px 12px;background:#eee7d8;min-height:100vh;}
  .qz-root{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--cream);
    color:var(--ink);
    border-radius:18px;
    padding:0;
    max-width:640px;
    margin:0 auto;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .qz-header{
    background:linear-gradient(135deg,var(--sage),var(--sage-dark));
    color:#fff;
    padding:20px 22px 16px;
  }
  .qz-title{font-size:20px;font-weight:900;letter-spacing:1px;margin:0 0 4px;}
  .qz-sub{font-size:12.5px;opacity:.9;margin:0;}
  .qz-tabs{display:flex;gap:8px;padding:14px 20px 0;}
  .qz-tab{
    flex:1;text-align:center;padding:10px 6px;border-radius:12px;
    background:#fff;border:2px solid var(--line);font-weight:700;font-size:14.5px;
    cursor:pointer;color:var(--sage-dark);transition:.15s;user-select:none;
  }
  .qz-tab.active{background:var(--sage-dark);color:#fff;border-color:var(--sage-dark);}
  .qz-body{padding:18px 20px 24px;}
  .qz-setup{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:10px 0 6px;}
  .qz-setup p{font-size:13.5px;color:#666;line-height:1.7;margin:0;}
  .qz-mode-row{display:flex;gap:10px;width:100%;}
  .qz-mode-btn{flex:1;padding:12px 4px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);}
  .qz-mode-btn.active{background:var(--gold);border-color:var(--gold);color:#4a3a10;}
  .qz-start{margin-top:6px;background:var(--coral);color:#fff;border:none;padding:13px 34px;border-radius:30px;font-size:15.5px;font-weight:900;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 0 #c85a52;}
  .qz-start:active{transform:translateY(2px);box-shadow:0 2px 0 #c85a52;}

  .qz-progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .qz-progress-bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .qz-progress-fill{height:100%;background:var(--sage);border-radius:4px;transition:width .25s;}
  .qz-progress-text{font-size:12px;font-weight:700;color:var(--sage-dark);white-space:nowrap;}
  .qz-score-pill{font-size:12px;font-weight:700;background:#fff;border:1.5px solid var(--line);padding:4px 10px;border-radius:20px;color:var(--sage-dark);white-space:nowrap;}
  .qz-home-btn{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;flex-shrink:0;
    border-radius:50%;border:1.5px solid var(--line);background:#fff;
    color:var(--sage-dark);font-size:16px;cursor:pointer;
  }
  .qz-home-btn:active{background:#f0ede2;}

  .qz-stage{
    position:relative;background:#fff;border:1.5px solid var(--line);
    border-radius:14px;padding:0;overflow:hidden;
  }
  .qz-img-wrap{position:relative;width:100%;line-height:0;}
  .qz-diagram-img{width:100%;height:auto;display:block;}
  .qz-ring{
    position:absolute;
    width:7%;
    aspect-ratio:1/1;
    border:3px solid #ef4136;
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 3px rgba(239,65,54,0.25);
    animation:qzPulse 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes qzPulse{
    0%{transform:translate(-50%,-50%) scale(0.85);opacity:1;}
    50%{transform:translate(-50%,-50%) scale(1.15);opacity:.65;}
    100%{transform:translate(-50%,-50%) scale(0.85);opacity:1;}
  }
  .qz-target-badge{
    display:inline-block;
    background:var(--sage-dark);color:#fff;
    font-weight:900;font-size:16px;padding:7px 16px;border-radius:22px;letter-spacing:1px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    margin-bottom:10px;
  }

  .qz-question{text-align:center;margin:14px 0 10px;font-size:15px;font-weight:700;color:var(--ink);}
  .qz-answer-row{display:flex;gap:8px;margin-bottom:10px;}
  .qz-input{flex:1;padding:12px 14px;border-radius:10px;border:2px solid var(--line);font-size:15px;outline:none;font-family:inherit;}
  .qz-input:focus{border-color:var(--sage);}
  .qz-submit{background:var(--sage-dark);color:#fff;border:none;padding:0 18px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;}
  .qz-choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .qz-choice{padding:11px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);}
  .qz-choice:active{background:#f0ede2;}
  .qz-choice.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .qz-choice.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .qz-choice[disabled]{cursor:default;}

  .qz-feedback{min-height:44px;text-align:center;font-size:14px;font-weight:700;border-radius:10px;padding:10px;margin-bottom:10px;display:none;}
  .qz-feedback.show{display:block;}
  .qz-feedback.ok{background:#e7f3ea;color:var(--correct);}
  .qz-feedback.bad{background:#fbe9e7;color:var(--wrong);}

  .qz-next{width:100%;background:var(--sage-dark);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;display:none;}
  .qz-next.show{display:block;}

  .qz-result{text-align:center;}
  .qz-result-score{font-size:42px;font-weight:900;color:var(--sage-dark);margin:6px 0 2px;}
  .qz-result-label{font-size:13px;color:#888;margin-bottom:16px;}
  .qz-review-list{text-align:left;max-height:260px;overflow-y:auto;border:1.5px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:16px;}
  .qz-review-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .qz-review-item:last-child{border-bottom:none;}
  .qz-review-tag{font-weight:900;font-size:12px;padding:2px 8px;border-radius:6px;color:#fff;flex-shrink:0;margin-left:8px;}
  .qz-review-tag.ok{background:var(--correct);}
  .qz-review-tag.bad{background:var(--wrong);}
  .qz-review-name{font-weight:700;}
  .qz-review-sub{color:#999;font-size:12px;}

  .qz-result-btns{display:flex;gap:10px;}
  .qz-result-btns button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;}
  .qz-retry-all{background:var(--coral);color:#fff;}
  .qz-retry-wrong{background:var(--gold);color:#4a3a10;}

  .qz-hidden{display:none !important;}
  .qz-modal-overlay{
    position:fixed;inset:0;background:rgba(30,28,22,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:999;padding:20px;
  }
  .qz-modal-box{
    background:#fff;border-radius:16px;padding:24px 22px 20px;
    max-width:340px;width:100%;text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .qz-modal-title{font-size:16px;font-weight:900;color:var(--ink);margin:0 0 8px;}
  .qz-modal-text{font-size:13.5px;color:#777;line-height:1.7;margin:0 0 18px;}
  .qz-modal-btns{display:flex;gap:10px;}
  .qz-modal-btns button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:800;font-size:14px;cursor:pointer;}
  .qz-modal-cancel{background:#f0ede2;color:var(--ink);}
  .qz-modal-confirm{background:var(--coral);color:#fff;}
  .qz-note{font-size:11.5px;color:#999;text-align:center;margin-top:10px;line-height:1.6;}
  .qz-reference{display:flex;flex-direction:column;gap:16px;}
  .qz-ref-img{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--line);}
</style>
</head>

      {n:2,name:"眼輪匝肌",x:25.1,y:34.8},
      {n:3,name:"顴肌",x:30.0,y:39.7},
      {n:4,name:"頰肌",x:31.5,y:44.9},
      {n:5,name:"口輪匝肌",x:24.7,y:45.4},
      {n:6,name:"下舌方肌",x:23.6,y:51.8},
      {n:7,name:"嚼肌",x:38.7,y:44.9},
      {n:8,name:"頸闊肌",x:44.3,y:62.6},
      {n:9,name:"胸鎖乳突肌",x:52.6,y:48.7},
      {n:10,name:"顳肌",x:46.0,y:25.7},
      {n:11,name:"枕肌",x:69.8,y:31.7},
      {n:12,name:"頦肌",x:20.9,y:53.9},
      {n:13,name:"斜方肌",x:66.0,y:62.3},
      {n:14,name:"胸大肌",x:30.2,y:89.0},
      {n:15,name:"三角肌",x:59.1,y:88.3}
    ]
  }
};

let currentDiagram = "skull";
let currentMode = "type";
let order = [];
let idx = 0;
let correctCount = 0;
let wrongCount = 0;
let results = [];

const $ = (id) => document.getElementById(id);

document.querySelectorAll('.qz-tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.qz-tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const target = t.dataset.diagram;

    if(target === 'reference'){
      $('qz-reference').classList.remove('qz-hidden');
      $('qz-setup').classList.add('qz-hidden');
      $('qz-quiz').classList.add('qz-hidden');
      $('qz-result').classList.add('qz-hidden');
    } else {
      currentDiagram = target;
      $('qz-reference').classList.add('qz-hidden');
      $('qz-quiz').classList.add('qz-hidden');
      $('qz-result').classList.add('qz-hidden');
      $('qz-setup').classList.remove('qz-hidden');
    }
  });
});

document.querySelectorAll('.qz-mode-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.qz-mode-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentMode = b.dataset.mode;
  });
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function startQuiz(customList){
  const set = DATA[currentDiagram];
  const pool = customList || set.points;
  order = shuffle(pool);
  idx = 0;
  correctCount = 0;
  wrongCount = 0;
  results = [];
  $('qz-setup').classList.add('qz-hidden');
  $('qz-result').classList.add('qz-hidden');
  $('qz-quiz').classList.remove('qz-hidden');
  $('qz-diagram-img').src = set.img;
  renderQuestion();
}

function renderDiagram(){
  const target = order[idx];
  const ring = $('qz-ring');
  ring.style.left = target.x + "%";
  ring.style.top = target.y + "%";
  $('qz-target-badge').textContent = "第 " + (idx+1) + " 題・編號 " + target.n;
}

function renderQuestion(){
  if(idx >= order.length){ return showResult(); }
  renderDiagram();
  $('qz-progress-text').textContent = (idx+1) + " / " + order.length;
  $('qz-progress-fill').style.width = ((idx)/order.length*100) + "%";
  $('qz-score-pill').textContent = "✔ " + correctCount + "　✘ " + wrongCount;
  $('qz-feedback').className = "qz-feedback";
  $('qz-feedback').textContent = "";
  $('qz-next-btn').classList.remove('show');

  const target = order[idx];

  if(currentMode === "type"){
    $('qz-type-row').classList.remove('qz-hidden');
    $('qz-choices').classList.add('qz-hidden');
    $('qz-input').value = "";
    $('qz-input').disabled = false;
    $('qz-submit-btn').disabled = false;
    setTimeout(()=>$('qz-input').focus(), 50);
  } else {
    $('qz-type-row').classList.add('qz-hidden');
    $('qz-choices').classList.remove('qz-hidden');
    const set = DATA[currentDiagram];
    const others = shuffle(set.points.filter(p=>p.name!==target.name)).slice(0,3);
    const choices = shuffle([target, ...others]);
    $('qz-choices').innerHTML = "";
    choices.forEach(c=>{
      const btn = document.createElement('button');
      btn.className = "qz-choice";
      btn.textContent = c.name;
      btn.addEventListener('click', ()=>handleChoiceAnswer(btn, c.name, target.name));
      $('qz-choices').appendChild(btn);
    });
  }
}

function normalize(s){ return s.replace(/\s+/g,'').trim(); }

function handleTypeAnswer(){
  const target = order[idx];
  const userAns = normalize($('qz-input').value);
  const correct = normalize(target.name);
  const isCorrect = userAns.length>0 && userAns === correct;
  finishAnswer(isCorrect, target);
  $('qz-input').disabled = true;
  $('qz-submit-btn').disabled = true;
}

function handleChoiceAnswer(btn, chosen, correctName){
  document.querySelectorAll('.qz-choice').forEach(b=>b.disabled = true);
  const isCorrect = chosen === correctName;
  if(isCorrect){
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.qz-choice').forEach(b=>{
      if(b.textContent === correctName) b.classList.add('correct');
    });
  }
  finishAnswer(isCorrect, order[idx]);
}

function finishAnswer(isCorrect, target){
  const fb = $('qz-feedback');
  fb.className = "qz-feedback show " + (isCorrect ? "ok":"bad");
  fb.textContent = isCorrect
    ? "✔ 答對了！編號 " + target.n + " 是「" + target.name + "」"
    : "✘ 答錯囉，編號 " + target.n + " 正確答案是「" + target.name + "」";
  if(isCorrect) correctCount++; else wrongCount++;
  results.push({n:target.n, name:target.name, ok:isCorrect});
  $('qz-score-pill').textContent = "✔ " + correctCount + "　✘ " + wrongCount;
  $('qz-next-btn').classList.add('show');
}

function nextQuestion(){
  idx++;
  renderQuestion();
}

function showResult(){
  $('qz-quiz').classList.add('qz-hidden');
  $('qz-result').classList.remove('qz-hidden');
  $('qz-result-score').textContent = correctCount + " / " + order.length;
  const list = $('qz-review-list');
  list.innerHTML = "";
  results.forEach(r=>{
    const row = document.createElement('div');
    row.className = "qz-review-item";
    row.innerHTML = `<span><span class="qz-review-sub">編號${r.n}　</span><span class="qz-review-name">${r.name}</span></span>
      <span class="qz-review-tag ${r.ok?'ok':'bad'}">${r.ok?'答對':'答錯'}</span>`;
    list.appendChild(row);
  });
}

$('qz-home-btn').addEventListener('click', ()=>{
  const answered = results.length;
  const remaining = order.length - answered;
  $('qz-modal-text').textContent = "測驗還沒完成，剩下 " + remaining + " 題。目前進度將不會保留。";
  $('qz-modal-overlay').classList.remove('qz-hidden');
});
$('qz-modal-cancel').addEventListener('click', ()=>{
  $('qz-modal-overlay').classList.add('qz-hidden');
});
$('qz-modal-confirm').addEventListener('click', ()=>{
  $('qz-modal-overlay').classList.add('qz-hidden');
  $('qz-quiz').classList.add('qz-hidden');
  $('qz-result').classList.add('qz-hidden');
  $('qz-setup').classList.remove('qz-hidden');
});
$('qz-start-btn').addEventListener('click', ()=>startQuiz());
$('qz-submit-btn').addEventListener('click', handleTypeAnswer);
$('qz-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !$('qz-input').disabled) handleTypeAnswer();
});
$('qz-next-btn').addEventListener('click', nextQuestion);
$('qz-retry-all-btn').addEventListener('click', ()=>{
  $('qz-result').classList.add('qz-hidden');
  $('qz-setup').classList.remove('qz-hidden');
});
$('qz-retry-wrong-btn').addEventListener('click', ()=>{
  const set = DATA[currentDiagram];
  const wrongNames = results.filter(r=>!r.ok).map(r=>r.n);
  const wrongPoints = set.points.filter(p=>wrongNames.includes(p.n));
  if(wrongPoints.length === 0){
    $('qz-result').classList.add('qz-hidden');
    $('qz-setup').classList.remove('qz-hidden');
    return;
  }
  startQuiz(wrongPoints);
});

})();
</script>
